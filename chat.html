<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат АТАМАНИ</title>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #0a0a0a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .chat-container {
            width: 100%;
            max-width: 800px;
            background: #1e1e1e;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 85vh;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .chat-header {
            background: #2c2c2c;
            padding: 16px 20px;
            border-bottom: 1px solid #3a3a3a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .chat-header h2 { color: #f5c542; font-size: 1.3rem; }
        .chat-header p { color: #aaa; font-size: 0.8rem; margin-top: 4px; }
        .header-buttons {
            display: flex;
            gap: 10px;
        }
        .header-buttons button {
            background: #3a3a3a;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            color: #eee;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
        }
        .header-buttons button:hover {
            background: #f5c542;
            color: #1e1e1e;
        }
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #121212;
            display: flex;
            flex-direction: column;
        }
        .message {
            padding: 10px 14px;
            border-radius: 18px;
            margin-bottom: 12px;
            max-width: 80%;
            word-wrap: break-word;
        }
        .message-user {
            background: #2b2f3a;
            align-self: flex-start;
        }
        .message-own {
            background: #3a2c1f;
            align-self: flex-end;
        }
        .message-name {
            font-weight: bold;
            font-size: 0.85rem;
            margin-bottom: 4px;
            color: #f5c542;
        }
        .message-time {
            font-size: 0.7rem;
            color: #888;
            text-align: right;
            margin-top: 4px;
        }
        .input-area {
            display: flex;
            gap: 12px;
            padding: 16px;
            background: #1a1a1a;
            border-top: 1px solid #333;
        }
        .input-area input {
            flex: 1;
            background: #2c2c2c;
            border: none;
            border-radius: 40px;
            padding: 12px 18px;
            color: white;
            font-size: 1rem;
            outline: none;
        }
        .input-area button {
            background: #f5c542;
            border: none;
            border-radius: 40px;
            padding: 0 24px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .input-area button:hover {
            background: #e0b03b;
        }
        .login-panel {
            text-align: center;
            padding: 40px;
        }
        .login-panel input {
            background: #2c2c2c;
            border: none;
            border-radius: 40px;
            padding: 12px 18px;
            color: white;
            width: 80%;
            margin: 20px auto;
            display: block;
            text-align: center;
        }
        .login-panel button {
            background: #f5c542;
            border: none;
            padding: 12px 32px;
            border-radius: 40px;
            font-weight: bold;
            margin-top: 16px;
            cursor: pointer;
        }
        .hidden { display: none; }
        .status {
            color: #aaa;
            font-size: 0.8rem;
            text-align: center;
            margin-top: 8px;
        }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">
        <div>
            <h2>🎧 Чат АТАМАНИ</h2>
            <p>Общайтесь со мной и другими слушателями</p>
        </div>
        <div class="header-buttons" id="commonButtons" style="display: none;">
            <button id="changeNameBtn">✏️ Сменить имя</button>
            <button id="logoutBtn">🚪 Выйти</button>
        </div>
        <div class="header-buttons" id="adminButtons" style="display: none;">
            <button id="clearChatBtn">🧹 Очистить чат</button>
            <button id="logoutBtnAdmin">🚪 Выйти</button>
        </div>
    </div>
    <div id="loginPanel" class="login-panel">
        <p>🔐 Войдите, чтобы начать общение</p>
        <input type="text" id="nicknameInput" placeholder="Ваше имя (как вас называть?)" maxlength="30">
        <button id="loginBtn">Войти в чат →</button>
    </div>
    <div id="chatInterface" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
        <div id="messagesArea" class="messages-area"></div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Ваше сообщение...">
            <button id="sendBtn">Отправить</button>
        </div>
    </div>
</div>

<script>
    // ========== НАСТРОЙКИ FIREBASE ==========
    const firebaseConfig = {
        apiKey: "AIzaSyBM2BzycMF6u-WAazEO1mv6baWV2U8PfY0",
        authDomain: "atamanichat.firebaseapp.com",
        projectId: "atamanichat",
        storageBucket: "atamanichat.firebasestorage.app",
        messagingSenderId: "5050919943",
        appId: "1:5050919943:web:ee84c743c59f9094b2cea2",
        measurementId: "G-8XRZPYBDCQ"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Элементы DOM
    const loginPanel = document.getElementById('loginPanel');
    const chatInterface = document.getElementById('chatInterface');
    const loginBtn = document.getElementById('loginBtn');
    const nicknameInput = document.getElementById('nicknameInput');
    const sendBtn = document.getElementById('sendBtn');
    const messageInput = document.getElementById('messageInput');
    const messagesArea = document.getElementById('messagesArea');
    const logoutBtn = document.getElementById('logoutBtn');
    const logoutBtnAdmin = document.getElementById('logoutBtnAdmin');
    const clearChatBtn = document.getElementById('clearChatBtn');
    const changeNameBtn = document.getElementById('changeNameBtn');
    const commonButtons = document.getElementById('commonButtons');
    const adminButtons = document.getElementById('adminButtons');

    let currentUser = null;
    let currentNickname = "";
    let unsubscribeMessages = null;
    let isAdmin = false;

    // 👑 ВСТАВЬТЕ СВОЙ UID (узнайте по инструкции ниже)
    const ADMIN_UID = "ВАШ_UID_ВСТАВЬТЕ_СЮДА";

    // Функция входа (с сохранением имени)
    loginBtn.onclick = () => {
        let nickname = nicknameInput.value.trim();
        if (nickname === "") {
            alert("Пожалуйста, введите ваше имя");
            return;
        }
        localStorage.setItem("chatNickname", nickname);
        auth.signInAnonymously().catch(e => alert('Ошибка входа: ' + e.message));
    };

    // Смена имени (доступна всегда после входа)
    function changeNickname() {
        const newName = prompt("Введите новое имя:", currentNickname);
        if (newName && newName.trim() !== "") {
            currentNickname = newName.trim();
            localStorage.setItem("chatNickname", currentNickname);
            alert(`Теперь вас зовут ${currentNickname}`);
        }
    }

    auth.onAuthStateChanged(async (user) => {
        if (user) {
            currentUser = user;
            // Загружаем ник из localStorage
            let savedNick = localStorage.getItem("chatNickname");
            if (savedNick) {
                currentNickname = savedNick;
            } else {
                currentNickname = "Слушатель_" + user.uid.slice(-4);
            }
            // Проверка на администратора
            if (user.uid === ADMIN_UID) {
                isAdmin = true;
                adminButtons.style.display = "flex";
                commonButtons.style.display = "none";
                if (logoutBtnAdmin) logoutBtnAdmin.onclick = () => { auth.signOut(); location.reload(); };
                if (clearChatBtn) clearChatBtn.onclick = clearAllMessages;
            } else {
                isAdmin = false;
                adminButtons.style.display = "none";
                commonButtons.style.display = "flex";
                if (logoutBtn) logoutBtn.onclick = () => { auth.signOut(); location.reload(); };
                if (changeNameBtn) changeNameBtn.onclick = changeNickname;
            }
            loginPanel.classList.add('hidden');
            chatInterface.classList.remove('hidden');
            loadMessages();
        } else {
            // Пользователь вышел
            currentUser = null;
            isAdmin = false;
            adminButtons.style.display = "none";
            commonButtons.style.display = "none";
            loginPanel.classList.remove('hidden');
            chatInterface.classList.add('hidden');
            if (unsubscribeMessages) unsubscribeMessages();
            // Не удаляем nickname из localStorage, чтобы при новом входе он подхватился
        }
    });

    // Загрузка сообщений
    function loadMessages() {
        if (unsubscribeMessages) unsubscribeMessages();
        unsubscribeMessages = db.collection('messages')
            .orderBy('timestamp', 'desc')
            .limit(100)
            .onSnapshot(snapshot => {
                const msgs = [];
                snapshot.forEach(doc => msgs.push({ id: doc.id, ...doc.data() }));
                msgs.sort((a,b) => (a.timestamp?.toMillis() || 0) - (b.timestamp?.toMillis() || 0));
                renderMessages(msgs);
            }, error => {
                console.error(error);
                messagesArea.innerHTML = '<div class="status">⚠️ Ошибка загрузки. Проверьте Firestore Rules.</div>';
            });
    }

    function renderMessages(messages) {
        messagesArea.innerHTML = '';
        messages.forEach(msg => {
            const isOwn = (currentUser && msg.uid === currentUser.uid);
            const div = document.createElement('div');
            div.className = `message ${isOwn ? 'message-own' : 'message-user'}`;
            const time = msg.timestamp ? new Date(msg.timestamp.toMillis()).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '';
            div.innerHTML = `
                <div class="message-name">${escapeHtml(msg.name || 'Аноним')}</div>
                <div>${escapeHtml(msg.text)}</div>
                <div class="message-time">${time}</div>
            `;
            messagesArea.appendChild(div);
        });
        messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    // Отправка сообщения с текущим ником
    sendBtn.onclick = () => {
        if (!currentUser) return;
        const text = messageInput.value.trim();
        if (!text) return;
        db.collection('messages').add({
            uid: currentUser.uid,
            name: currentNickname,
            text: text,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => messageInput.value = '')
          .catch(e => alert('Ошибка отправки: ' + e.message));
    };
    messageInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendBtn.click(); });

    // Функция очистки всех сообщений (только админ)
    async function clearAllMessages() {
        if (!isAdmin) {
            alert("Эта функция доступна только администратору.");
            return;
        }
        if (confirm("Вы уверены, что хотите удалить ВСЕ сообщения в чате? Это действие необратимо.")) {
            try {
                const snapshot = await db.collection('messages').get();
                const batch = db.batch();
                snapshot.docs.forEach(doc => {
                    batch.delete(doc.ref);
                });
                await batch.commit();
                alert("Чат очищен.");
            } catch (e) {
                alert("Ошибка очистки: " + e.message);
            }
        }
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
</script>
</body>
</html>
