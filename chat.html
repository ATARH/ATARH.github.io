<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат АТАМАНИ</title>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #0a0a0a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        /* Контейнер чата — стилизация под ваш сайт */
        .chat-container {
            width: 100%;
            max-width: 900px;
            background: linear-gradient(145deg, #1a1a1a 0%, #0f0f0f 100%);
            border-radius: 24px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5), 0 0 0 1px rgba(245,197,66,0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 85vh;
            backdrop-filter: blur(2px);
        }
        .chat-header {
            background: #000000aa;
            backdrop-filter: blur(10px);
            padding: 18px 24px;
            border-bottom: 2px solid #f5c542;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
        }
        .title h2 {
            color: #f5c542;
            font-size: 1.6rem;
            letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(245,197,66,0.3);
        }
        .title p {
            color: #bbb;
            font-size: 0.8rem;
        }
        .chat-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .logout-btn, .clear-btn {
            background: #2c2c2c;
            border: none;
            padding: 6px 14px;
            border-radius: 40px;
            color: #f5c542;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.8rem;
        }
        .logout-btn:hover, .clear-btn:hover {
            background: #3a3a3a;
            color: #ffd966;
        }
        .clear-btn {
            background: #3a2a1f;
            color: #ffaa66;
        }
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(10,10,10,0.7);
        }
        .message {
            padding: 10px 16px;
            border-radius: 20px;
            max-width: 80%;
            word-wrap: break-word;
            animation: fadeIn 0.2s ease;
        }
        .message-user {
            background: #2a2e3a;
            align-self: flex-start;
            border-left: 3px solid #f5c542;
        }
        .message-own {
            background: #3a2c1f;
            align-self: flex-end;
            border-right: 3px solid #f5c542;
        }
        .message-name {
            font-weight: bold;
            font-size: 0.85rem;
            color: #f5c542;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }
        .message-time {
            font-size: 0.7rem;
            color: #aaa;
            margin-top: 4px;
            text-align: right;
        }
        .input-area {
            display: flex;
            gap: 12px;
            padding: 16px 20px;
            background: #111;
            border-top: 1px solid #333;
        }
        .input-area input {
            flex: 1;
            background: #222;
            border: none;
            border-radius: 40px;
            padding: 12px 18px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
        }
        .input-area input:focus {
            background: #2a2a2a;
            box-shadow: 0 0 0 2px #f5c54266;
        }
        .input-area button {
            background: #f5c542;
            border: none;
            border-radius: 40px;
            padding: 0 28px;
            font-weight: bold;
            color: #111;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1rem;
        }
        .input-area button:hover {
            background: #e0b03b;
            transform: scale(1.02);
        }
        .login-panel {
            text-align: center;
            padding: 50px 20px;
            background: #1a1a1a;
        }
        .login-panel p {
            color: #ddd;
            margin-bottom: 20px;
        }
        .login-panel button {
            background: #f5c542;
            border: none;
            padding: 12px 32px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
        }
        .name-change-area {
            display: flex;
            gap: 8px;
            padding: 10px 20px;
            background: #0a0a0a;
            border-bottom: 1px solid #2a2a2a;
        }
        .name-change-area input {
            background: #222;
            border: none;
            border-radius: 40px;
            padding: 6px 14px;
            color: white;
            flex: 1;
        }
        .name-change-area button {
            background: #3a3a3a;
            border: none;
            border-radius: 40px;
            padding: 6px 16px;
            color: #f5c542;
            cursor: pointer;
            font-weight: bold;
        }
        .hidden { display: none; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Адаптив под телефон */
        @media (max-width: 600px) {
            .message { max-width: 95%; }
            .chat-header { flex-direction: column; gap: 10px; }
            .input-area { gap: 6px; }
            .input-area button { padding: 0 18px; }
        }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">
        <div class="title">
            <h2>🎧 Чат АТАМАНИ</h2>
            <p>Общайтесь со мной и другими слушателями</p>
        </div>
        <div class="chat-controls">
            <button id="clearChatBtn" class="clear-btn" title="Очистить все сообщения (только для АТАМАНИ)">🧹 Очистить</button>
            <button id="logoutBtn" class="logout-btn">🚪 Выйти</button>
        </div>
    </div>

    <!-- Панель входа (показывается, если не авторизован) -->
    <div id="loginPanel" class="login-panel">
        <p>🔐 Войдите анонимно, чтобы начать общение</p>
        <button id="loginBtn">Войти в чат →</button>
    </div>

    <!-- Интерфейс чата (виден после входа) -->
    <div id="chatInterface" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
        <!-- Смена имени -->
        <div class="name-change-area">
            <input type="text" id="nicknameInput" placeholder="Ваше имя (отобразится в чате)" maxlength="30">
            <button id="changeNameBtn">Сменить имя</button>
        </div>
        <div id="messagesArea" class="messages-area"></div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Ваше сообщение...">
            <button id="sendBtn">Отправить</button>
        </div>
    </div>
</div>

<script>
    // Firebase конфиг (ваш)
    const firebaseConfig = {
        apiKey: "AIzaSyBM2BzycMF6u-WAazEO1mv6baWV2U8PfY0",
        authDomain: "atamanichat.firebaseapp.com",
        projectId: "atamanichat",
        storageBucket: "atamanichat.firebasestorage.app",
        messagingSenderId: "5050919943",
        appId: "1:5050919943:web:ee84c743c59f9094b2cea2",
        measurementId: "G-8XRZPYBDCQ"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // DOM элементы
    const loginPanel = document.getElementById('loginPanel');
    const chatInterface = document.getElementById('chatInterface');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const sendBtn = document.getElementById('sendBtn');
    const messageInput = document.getElementById('messageInput');
    const messagesArea = document.getElementById('messagesArea');
    const nicknameInput = document.getElementById('nicknameInput');
    const changeNameBtn = document.getElementById('changeNameBtn');
    const clearChatBtn = document.getElementById('clearChatBtn');

    let currentUser = null;
    let unsubscribeMessages = null;
    let currentNickname = '';

    // Функция получения имени пользователя из Firestore (документ users/{uid})
    async function loadUserNickname(uid) {
        try {
            const doc = await db.collection('users').doc(uid).get();
            if (doc.exists && doc.data().nickname) {
                currentNickname = doc.data().nickname;
                nicknameInput.value = currentNickname;
            } else {
                // По умолчанию: Слушатель_ + последние 4 символа UID
                const defaultName = `Слушатель_${uid.slice(-4)}`;
                currentNickname = defaultName;
                nicknameInput.value = defaultName;
                await db.collection('users').doc(uid).set({ nickname: defaultName });
            }
        } catch(e) { console.error(e); }
    }

    // Сохранение имени в Firestore
    async function saveNickname(uid, newName) {
        if (!newName.trim()) return false;
        try {
            await db.collection('users').doc(uid).set({ nickname: newName.trim() }, { merge: true });
            currentNickname = newName.trim();
            return true;
        } catch(e) { alert('Ошибка сохранения имени'); return false; }
    }

    // Вход / выход
    loginBtn.onclick = () => {
        auth.signInAnonymously().catch(e => alert('Ошибка входа: ' + e.message));
    };

    logoutBtn.onclick = () => {
        auth.signOut().catch(e => alert('Ошибка выхода: ' + e.message));
    };

    // Смена имени
    changeNameBtn.onclick = async () => {
        if (!currentUser) return;
        const newName = nicknameInput.value.trim();
        if (newName === '') return;
        if (await saveNickname(currentUser.uid, newName)) {
            // Имя в текущих сообщениях не обновится (хранятся старые), но новые будут с новым именем
            alert('Имя изменено! Новые сообщения будут с этим именем.');
        }
    };

    // Отслеживание состояния пользователя
    auth.onAuthStateChanged(async (user) => {
        if (user) {
            currentUser = user;
            loginPanel.classList.add('hidden');
            chatInterface.classList.remove('hidden');
            await loadUserNickname(user.uid);
            loadMessages();
        } else {
            currentUser = null;
            loginPanel.classList.remove('hidden');
            chatInterface.classList.add('hidden');
            if (unsubscribeMessages) unsubscribeMessages();
        }
    });

    // Загрузка сообщений
    function loadMessages() {
        if (unsubscribeMessages) unsubscribeMessages();
        unsubscribeMessages = db.collection('messages')
            .orderBy('timestamp', 'desc')
            .limit(200)
            .onSnapshot((snapshot) => {
                const msgs = [];
                snapshot.forEach(doc => msgs.push({ id: doc.id, ...doc.data() }));
                msgs.sort((a,b) => (a.timestamp?.toMillis() || 0) - (b.timestamp?.toMillis() || 0));
                renderMessages(msgs);
            }, (error) => {
                console.error(error);
                messagesArea.innerHTML = '<div style="color:red;">Ошибка загрузки сообщений. Проверьте правила Firestore.</div>';
            });
    }

    // Отображение сообщений
    function renderMessages(messages) {
        messagesArea.innerHTML = '';
        messages.forEach(msg => {
            const isOwn = currentUser && msg.uid === currentUser.uid;
            const div = document.createElement('div');
            div.className = `message ${isOwn ? 'message-own' : 'message-user'}`;
            const time = msg.timestamp ? new Date(msg.timestamp.toMillis()).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '';
            const displayName = msg.name || 'Аноним';
            div.innerHTML = `
                <div class="message-name">${escapeHtml(displayName)}</div>
                <div>${escapeHtml(msg.text)}</div>
                <div class="message-time">${time}</div>
            `;
            messagesArea.appendChild(div);
        });
        messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    // Отправка сообщения
    sendBtn.onclick = async () => {
        if (!currentUser) return;
        const text = messageInput.value.trim();
        if (!text) return;
        // Используем текущее имя из памяти (или загружаем свежее)
        let nameToSend = currentNickname;
        if (!nameToSend) {
            const doc = await db.collection('users').doc(currentUser.uid).get();
            nameToSend = doc.exists ? doc.data().nickname : `Слушатель_${currentUser.uid.slice(-4)}`;
            currentNickname = nameToSend;
        }
        db.collection('messages').add({
            uid: currentUser.uid,
            name: nameToSend,
            text: text,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => messageInput.value = '')
          .catch(e => alert('Ошибка отправки: ' + e.message));
    };

    messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendBtn.click(); });

    // Очистка чата (только для администратора – hardcoded uid АТАМАНИ)
    // Для безопасности: вы должны знать свой uid (можно посмотреть после входа в консоли firebase -> Authentication -> Users)
    // Или просто разрешить очистку только определённому пользователю.
    clearChatBtn.onclick = async () => {
        if (!currentUser) return;
        // Замените 'ВАШ_UID' на реальный uid вашего аккаунта. 
        // Чтобы узнать uid: войдите в чат, откройте консоль браузера (F12), введите auth.currentUser.uid
        // Или посмотрите в Firebase Console -> Authentication -> Users -> ваш анонимный пользователь.
        const ownerUid = 'ВАШ_UID'; // <-- СЮДА ВСТАВЬТЕ СВОЙ UID
        if (currentUser.uid !== ownerUid) {
            alert('Очищать чат может только администратор (АТАМАНИ)');
            return;
        }
        if (confirm('Вы уверены, что хотите удалить ВСЕ сообщения в чате? Это действие необратимо.')) {
            try {
                const snapshot = await db.collection('messages').get();
                const batch = db.batch();
                snapshot.forEach(doc => batch.delete(doc.ref));
                await batch.commit();
                alert('Чат очищен');
            } catch(e) {
                alert('Ошибка очистки: ' + e.message);
            }
        }
    };

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
</script>
</body>
</html>
