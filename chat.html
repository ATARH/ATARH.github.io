<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат АТАМАНИ</title>
    <!-- Подключаем Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .chat-container {
            width: 100%;
            max-width: 800px;
            background: #1e1e1e;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 80vh;
        }
        .chat-header {
            background: #2c2c2c;
            padding: 16px 20px;
            border-bottom: 1px solid #3a3a3a;
        }
        .chat-header h2 {
            color: #f5c542;
            font-size: 1.3rem;
            letter-spacing: 1px;
        }
        .chat-header p {
            color: #aaa;
            font-size: 0.8rem;
            margin-top: 4px;
        }
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #121212;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 18px;
            word-wrap: break-word;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .message-user {
            background: #2b2f3a;
            color: #e0e0e0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .message-own {
            background: #3a2c1f;
            color: #f5e6c4;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message-name {
            font-weight: bold;
            font-size: 0.8rem;
            margin-bottom: 4px;
            color: #f5c542;
        }
        .message-time {
            font-size: 0.7rem;
            color: #888;
            margin-top: 4px;
            text-align: right;
        }
        .input-area {
            display: flex;
            gap: 12px;
            padding: 16px;
            background: #1a1a1a;
            border-top: 1px solid #333;
        }
        .input-area input {
            flex: 1;
            background: #2c2c2c;
            border: none;
            border-radius: 40px;
            padding: 12px 18px;
            color: white;
            font-size: 1rem;
            outline: none;
        }
        .input-area input::placeholder {
            color: #777;
        }
        .input-area button {
            background: #f5c542;
            border: none;
            border-radius: 40px;
            padding: 0 24px;
            font-weight: bold;
            color: #1e1e1e;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1rem;
        }
        .input-area button:hover {
            background: #e0b03b;
        }
        .login-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 40px;
            text-align: center;
        }
        .login-panel button {
            background: #f5c542;
            border: none;
            padding: 12px 32px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
        .login-panel p {
            color: #ccc;
        }
        .hidden {
            display: none;
        }
        .status {
            color: #aaa;
            font-size: 0.8rem;
            text-align: center;
            margin-top: 8px;
        }
    </style>
</head>
<body>
<div class="chat-container" id="chatContainer">
    <div class="chat-header">
        <h2>🎧 Чат АТАМАНИ</h2>
        <p>Общайтесь со мной и другими слушателями</p>
    </div>
    <div id="loginPanel" class="login-panel">
        <p>🔐 Войдите анонимно, чтобы начать общение</p>
        <button id="loginBtn">Войти в чат →</button>
    </div>
    <div id="chatInterface" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
        <div id="messagesArea" class="messages-area"></div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Ваше сообщение..." maxlength="500">
            <button id="sendBtn">Отправить</button>
        </div>
    </div>
</div>

<script>
    // ==================== ВАШИ ДАННЫЕ ИЗ FIREBASE ====================
    const firebaseConfig = {
        apiKey: "AIzaSyBM2BzycMF6u-WAaZeO1mv6baWV2U8PfY0",
        authDomain: "atamanichat.firebaseapp.com",
        projectId: "atamanichat",
        storageBucket: "atamanichat.firebasestorage.app",
        messagingSenderId: "5050919943",
        appId: "1:5050919943:web:ee84c743c59f9094b2cea2",
        measurementId: "G-8XRZPYBDCQ"
    };

    // Инициализация Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Элементы DOM
    const loginPanel = document.getElementById('loginPanel');
    const chatInterface = document.getElementById('chatInterface');
    const loginBtn = document.getElementById('loginBtn');
    const sendBtn = document.getElementById('sendBtn');
    const messageInput = document.getElementById('messageInput');
    const messagesArea = document.getElementById('messagesArea');

    let currentUser = null;
    let unsubscribeMessages = null;

    // Функция входа (анонимно)
    loginBtn.addEventListener('click', () => {
        auth.signInAnonymously()
            .then((userCredential) => {
                console.log('Вошли как аноним');
            })
            .catch((error) => {
                console.error('Ошибка входа:', error);
                alert('Не удалось войти в чат. Проверьте настройки Firebase Authentication.');
            });
    });

    // Отслеживаем состояние пользователя
    auth.onAuthStateChanged((user) => {
        if (user) {
            currentUser = user;
            loginPanel.classList.add('hidden');
            chatInterface.classList.remove('hidden');
            // Загружаем сообщения
            loadMessages();
        } else {
            currentUser = null;
            loginPanel.classList.remove('hidden');
            chatInterface.classList.add('hidden');
            if (unsubscribeMessages) {
                unsubscribeMessages();
                unsubscribeMessages = null;
            }
        }
    });

    // Загрузка и прослушивание сообщений
    function loadMessages() {
        if (unsubscribeMessages) unsubscribeMessages();
        // Запрашиваем последние 100 сообщений, сортируем по времени
        const query = db.collection('messages')
            .orderBy('timestamp', 'desc')
            .limit(100);
        unsubscribeMessages = query.onSnapshot((snapshot) => {
            // Сортируем обратно по возрастанию времени (для отображения сверху вниз)
            const docs = snapshot.docs;
            const messages = [];
            docs.forEach(doc => {
                messages.push({ id: doc.id, ...doc.data() });
            });
            messages.sort((a, b) => a.timestamp - b.timestamp);
            renderMessages(messages);
        }, (error) => {
            console.error('Ошибка загрузки сообщений:', error);
            messagesArea.innerHTML = '<div class="status">⚠️ Ошибка загрузки чата. Возможно, не включена Firestore.</div>';
        });
    }

    // Отображение сообщений
    function renderMessages(messages) {
        messagesArea.innerHTML = '';
        messages.forEach(msg => {
            const isOwn = (currentUser && msg.uid === currentUser.uid);
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isOwn ? 'message-own' : 'message-user'}`;
            const date = new Date(msg.timestamp);
            const timeStr = `${date.getHours().toString().padStart(2,'0')}:${date.getMinutes().toString().padStart(2,'0')}`;
            messageDiv.innerHTML = `
                <div class="message-name">${escapeHtml(msg.name || 'Аноним')}</div>
                <div>${escapeHtml(msg.text)}</div>
                <div class="message-time">${timeStr}</div>
            `;
            messagesArea.appendChild(messageDiv);
        });
        // Прокрутка вниз
        messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    // Отправка сообщения
    function sendMessage() {
        if (!currentUser) {
            alert('Войдите в чат сначала');
            return;
        }
        const text = messageInput.value.trim();
        if (text === '') return;

        // Генерация имени: "Слушатель" + последние 4 символа UID
        const shortUid = currentUser.uid.slice(-4);
        const displayName = `Слушатель_${shortUid}`;

        db.collection('messages').add({
            uid: currentUser.uid,
            name: displayName,
            text: text,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => {
            messageInput.value = '';
        }).catch(error => {
            console.error('Ошибка отправки:', error);
            alert('Не удалось отправить сообщение. Проверьте правила Firestore.');
        });
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    // Простая защита от XSS
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }
</script>
</body>
</html>
