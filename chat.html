<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат АТАМАНИ</title>
    <!-- Правильное подключение Firebase SDK (совместимая версия) -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #0a0a0a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .chat-container {
            width: 100%;
            max-width: 800px;
            background: #1e1e1e;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 80vh;
        }
        .chat-header {
            background: #2c2c2c;
            padding: 16px 20px;
            border-bottom: 1px solid #3a3a3a;
        }
        .chat-header h2 { color: #f5c542; }
        .chat-header p { color: #aaa; font-size: 0.8rem; }
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #121212;
        }
        .message {
            padding: 10px 14px;
            border-radius: 18px;
            margin-bottom: 12px;
            max-width: 80%;
        }
        .message-user {
            background: #2b2f3a;
            align-self: flex-start;
        }
        .message-own {
            background: #3a2c1f;
            align-self: flex-end;
        }
        .message-name { font-weight: bold; color: #f5c542; }
        .message-time { font-size: 0.7rem; color: #888; text-align: right; }
        .input-area {
            display: flex;
            gap: 12px;
            padding: 16px;
            background: #1a1a1a;
            border-top: 1px solid #333;
        }
        .input-area input {
            flex: 1;
            background: #2c2c2c;
            border: none;
            border-radius: 40px;
            padding: 12px 18px;
            color: white;
        }
        .input-area button {
            background: #f5c542;
            border: none;
            border-radius: 40px;
            padding: 0 24px;
            font-weight: bold;
            cursor: pointer;
        }
        .login-panel {
            text-align: center;
            padding: 40px;
        }
        .login-panel button {
            background: #f5c542;
            border: none;
            padding: 12px 32px;
            border-radius: 40px;
            font-weight: bold;
            margin-top: 16px;
            cursor: pointer;
        }
        .hidden { display: none; }
        .messages-area { display: flex; flex-direction: column; }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">
        <h2>🎧 Чат АТАМАНИ</h2>
        <p>Общайтесь со мной и другими слушателями</p>
    </div>
    <div id="loginPanel" class="login-panel">
        <p>🔐 Войдите анонимно, чтобы начать общение</p>
        <button id="loginBtn">Войти в чат →</button>
    </div>
    <div id="chatInterface" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
        <div id="messagesArea" class="messages-area"></div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Ваше сообщение...">
            <button id="sendBtn">Отправить</button>
        </div>
    </div>
</div>

<script>
    // ВАШИ ДАННЫЕ (исправьте apiKey – у вас опечатка: "AIZaSy..." должно быть "AIzaSy...")
    const firebaseConfig = {
        apiKey: "AIzaSyBM2BzycMF6u-WAaZeO1mv6baWV2U8PfY0",
        authDomain: "atamanichat.firebaseapp.com",
        projectId: "atamanichat",
        storageBucket: "atamanichat.firebasestorage.app", // можно заменить на "atamanichat.appspot.com" если не работает
        messagingSenderId: "5050919943",
        appId: "1:5050919943:web:ee84c743c59f9094b2cea2",
        measurementId: "G-8XRZPYBDCQ"
    };

    // Инициализация Firebase (Compat)
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const loginPanel = document.getElementById('loginPanel');
    const chatInterface = document.getElementById('chatInterface');
    const loginBtn = document.getElementById('loginBtn');
    const sendBtn = document.getElementById('sendBtn');
    const messageInput = document.getElementById('messageInput');
    const messagesArea = document.getElementById('messagesArea');

    let currentUser = null;
    let unsubscribe = null;

    loginBtn.onclick = () => {
        auth.signInAnonymously().catch(e => alert('Ошибка: ' + e.message));
    };

    auth.onAuthStateChanged(user => {
        if (user) {
            currentUser = user;
            loginPanel.classList.add('hidden');
            chatInterface.classList.remove('hidden');
            loadMessages();
        } else {
            currentUser = null;
            loginPanel.classList.remove('hidden');
            chatInterface.classList.add('hidden');
            if (unsubscribe) unsubscribe();
        }
    });

    function loadMessages() {
        if (unsubscribe) unsubscribe();
        unsubscribe = db.collection('messages')
            .orderBy('timestamp', 'desc')
            .limit(100)
            .onSnapshot(snapshot => {
                const msgs = [];
                snapshot.forEach(doc => msgs.push({ id: doc.id, ...doc.data() }));
                msgs.sort((a,b) => (a.timestamp?.toMillis() || 0) - (b.timestamp?.toMillis() || 0));
                renderMessages(msgs);
            }, error => {
                console.error(error);
                messagesArea.innerHTML = '<div style="color:red;">Ошибка загрузки. Проверьте правила Firestore.</div>';
            });
    }

    function renderMessages(messages) {
        messagesArea.innerHTML = '';
        messages.forEach(msg => {
            const isOwn = currentUser && msg.uid === currentUser.uid;
            const div = document.createElement('div');
            div.className = `message ${isOwn ? 'message-own' : 'message-user'}`;
            const time = msg.timestamp ? new Date(msg.timestamp.toMillis()).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '';
            div.innerHTML = `
                <div class="message-name">${escapeHtml(msg.name || 'Аноним')}</div>
                <div>${escapeHtml(msg.text)}</div>
                <div class="message-time">${time}</div>
            `;
            messagesArea.appendChild(div);
        });
        messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    sendBtn.onclick = () => {
        if (!currentUser) return;
        const text = messageInput.value.trim();
        if (!text) return;
        const shortUid = currentUser.uid.slice(-4);
        db.collection('messages').add({
            uid: currentUser.uid,
            name: `Слушатель_${shortUid}`,
            text: text,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => messageInput.value = '')
          .catch(e => alert('Ошибка: ' + e.message));
    };

    messageInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendBtn.click(); });

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
</script>
</body>
</html>
